<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Paranoic">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1d24"/>
      <stop offset="55%" stop-color="#0c0d10"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="plate" x1="18%" y1="8%" x2="85%" y2="92%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="32%" stop-color="#E2E8F0" stop-opacity="0.88"/>
      <stop offset="68%" stop-color="#94A3B8" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="glow" cx="34%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#F8FAFC" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App icon canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Soft ground shadow -->
  <ellipse cx="256" cy="430" rx="120" ry="28" fill="#000" opacity="0.35"/>

  <!-- Glass shield -->
  <g filter="url(#soft)">
    <path
      d="M256 72c-72 0-132 25-171 67C46 181 28 240 28 276c0 87 49 157 125 190 35 15 73 23 103 23s68-8 103-23c76-33 125-103 125-190 0-36-18-95-57-137-39-42-99-67-171-67z"
      fill="url(#plate)"
      stroke="url(#edge)"
      stroke-width="8"
    />
    <circle cx="190" cy="190" r="110" fill="url(#glow)"/>
    <path
      d="M90 120l280 280"
      stroke="url(#shine)"
      stroke-width="54"
      stroke-linecap="round"
      opacity="0.55"
    />
  </g>

  <!-- Letter P -->
  <path
    d="M198 158h86c44 0 74 27 74 66 0 38-29 65-73 65h-43v86c0 9-5 14-13 14h-17c-8 0-14-5-14-14V172c0-9 6-14 14-14h-14zm44 38v55h40c22 0 35-11 35-28s-13-27-35-27h-40z"
    fill="#0F172A"
    fill-opacity="0.62"
  />
  <path
    d="M202 154h86c46 0 78 28 78 68 0 40-30 68-76 68h-44v82c0 5-3 8-7 8h-18c-4 0-7-3-7-8V166c0-7 4-12 12-12h-24z"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.28"
    stroke-width="4"
  />
</svg>
